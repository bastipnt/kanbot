<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7078F6"/>
      <stop offset="1" stop-color="#4148D2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
<rect width="1024" height="1024" fill="url(#bg)"/><g transform="translate(512 528) scale(0.92) translate(-512 -512)" filter="url(#shadow)">
  <g id="mark">
    <!-- antenna -->
    <rect x="500" y="200" width="24" height="96" rx="12" fill="#FFFFFF"/>
    <circle cx="512" cy="190" r="38" fill="#FFB547"/>
    <!-- ears -->
    <rect x="186" y="440" width="64" height="150" rx="28" fill="#FFFFFF"/>
    <rect x="774" y="440" width="64" height="150" rx="28" fill="#FFFFFF"/>
    <!-- head / board -->
    <rect x="232" y="280" width="560" height="470" rx="112" fill="#FFFFFF"/>
    <!-- column 1: to do -->
    <rect x="302" y="352" width="116" height="150" rx="30" fill="#5D66EA"/>
    <rect x="302" y="518" width="116" height="110" rx="30" fill="#A9AEF7"/>
    <!-- column 2: doing -->
    <rect x="454" y="352" width="116" height="96" rx="30" fill="#A9AEF7"/>
    <rect x="454" y="464" width="116" height="164" rx="30" fill="#5D66EA"/>
    <!-- column 3: done (by the bot) -->
    <rect x="606" y="352" width="116" height="130" rx="30" fill="#FFB547"/>
    <rect x="606" y="498" width="116" height="76" rx="30" fill="#A9AEF7"/>
  </g>
</g></svg>
