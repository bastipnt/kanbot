name: server

on:
  push:
    branches: [main]
    paths: ["server/**", "docs/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "docs/**", ".github/workflows/server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kanbot
          POSTGRES_PASSWORD: kanbot
          POSTGRES_DB: kanbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kanbot -d kanbot"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://kanbot:kanbot@localhost:5432/kanbot
      JWT_SECRET: ci-test-secret
      PUBLIC_URL: http://localhost:8787
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun test
